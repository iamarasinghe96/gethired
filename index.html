<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetHired has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://gaiasymbiosis.com/tools/cv-builder">
<noscript><meta http-equiv="refresh" content="0; url=https://gaiasymbiosis.com/tools/cv-builder"></noscript>
<style>
  :root{--ink:#1a1f2e;--muted:#5b6678;--navy:#1F4E79;--pale:#e8f0f9;--border:#d1dce8;--bg:#f7f9fc;--card:#ffffff;}
  @media (prefers-color-scheme: dark){:root{--ink:#e6ebf2;--muted:#a3adbb;--navy:#8fb8e6;--pale:#1d2a3a;--border:#2c3a4d;--bg:#10151d;--card:#171e29;}}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;}
  main{max-width:560px;margin:10vh auto 40px;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;}
  h1{font-size:22px;margin:0 0 8px;}
  p{margin:0 0 14px;color:var(--muted);}
  a{color:var(--navy);}
  .go{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:600;}
  @media (prefers-color-scheme: dark){.go{color:#10151d;}}
  #saved{display:none;margin:18px 0;padding:16px;background:var(--pale);border-radius:8px;}
  #saved h2{font-size:15px;margin:0 0 6px;}
  #saved p{margin-bottom:10px;}
  #saved button{display:block;width:100%;margin:8px 0 0;padding:9px 12px;font:inherit;text-align:left;cursor:pointer;
                 background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:6px;}
  #saved button:hover{border-color:var(--navy);}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>GetHired has moved</h1>
    <p>The CV and cover letter builder now lives at
       <a href="https://gaiasymbiosis.com/tools/cv-builder">gaiasymbiosis.com/tools/cv-builder</a>.</p>
    <div id="saved">
      <h2>You have work saved in this browser</h2>
      <p>The new site can't read it, so download it first. Then use <strong>Parse &amp; Import</strong> on the new site to load your CV Bank.</p>
      <div id="dl"></div>
    </div>
    <a class="go" href="https://gaiasymbiosis.com/tools/cv-builder">Continue to the new site &rarr;</a>
  </div>
</main>
<script>
const NEW_URL = 'https://gaiasymbiosis.com/tools/cv-builder';

// Everything below is read from this browser only; nothing is sent anywhere.
function get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }

// ---- copied unchanged from the GetHired app, so the download imports cleanly ----
let P;
function defaultP() {
  return {
    personal: {
      fullName:'', dob:'', address:'', location:'', phone:'', phone2:'',
      email:'', linkedin:'', portfolio:'', rtwUrl:'', seekUrl:'',
      rightToWork:'', locationNote:'', languages:'',
      nic:'', sex:'', civilStatus:'', ethnicGroup:''
    },
    summary: { headline:'', tagline:'', paragraphs:'' },
    skills:       [{ category:'', items:'' }],
    workHistory:  [{ title:'', employer:'', startDate:'', endDate:'', nature:'', bullets:'', respUrl:'', milestonesUrl:'' }],
    education:    [{ degree:'', institution:'', startYear:'', endYear:'', gpa:'', thesis:'', notes:'', credentialsUrl:'' }],
    certifications: [{ category:'', items:'' }],
    publications: { academic:'', awards:'' },
    storyBank:    [{ title:'', usedFor:'', text:'' }],
    projects:     [{ name:'', description:'', url:'' }],
    achievements: [{ category:'', items:'' }],
    referees:     [{ name:'', title:'', email:'', phone:'', linkedin:'' }],
    usageNotes:   ''
  };
}

function generateCVBankText() {
  const name = P.personal.fullName || 'YOUR NAME';
  const monthYear = new Date().toLocaleString('en-AU', { month:'long', year:'numeric' });
  const lines = [];

  const push = (...args) => args.forEach(l => lines.push(l));
  const nl = () => lines.push('');
  const section = title => { nl(); push(title); nl(); };

  push(`${name} \u2014 MASTER CV CONTENT BANK`);
  push(`(Merged: PDF CV + LinkedIn + All Cover Letters \u2014 ${monthYear})`);
  nl();

  // PERSONAL INFORMATION
  section('PERSONAL INFORMATION');
  const p = P.personal;
  if (p.fullName)      push(`Full Name: ${p.fullName}`);
  if (p.dob)           push(`Date of Birth: ${p.dob}`);
  if (p.address)       push(`Address: ${p.address}`);
  if (p.phone)         push(`Mobile: ${p.phone}`);
  if (p.phone2)        push(`Secondary Phone: ${p.phone2}`);
  if (p.email)         push(`Email: ${p.email}`);
  if (p.linkedin)      push(`LinkedIn: ${p.linkedin}`);
  if (p.portfolio)     push(`GitHub / Portfolio: ${p.portfolio}`);
  if (p.rtwUrl)        push(`Right to Work URL: ${p.rtwUrl}`);
  if (p.seekUrl)       push(`SEEK Profile: ${p.seekUrl}`);
  if (p.sex)           push(`Sex: ${p.sex}`);
  if (p.civilStatus)   push(`Civil Status: ${p.civilStatus}`);
  if (p.ethnicGroup)   push(`Ethnic Group: ${p.ethnicGroup}`);
  if (p.nic)           push(`NIC: ${p.nic}`);
  if (p.rightToWork)   push(`Right to Work (Australia): ${p.rightToWork}`);
  if (p.locationNote)  push(`Location note: ${p.locationNote}`);
  if (p.languages)     push(`Languages: ${p.languages}`);
  nl();

  // PROFESSIONAL SUMMARY
  section('PROFESSIONAL SUMMARY / ABOUT ME');
  if (P.summary.paragraphs) push(P.summary.paragraphs);
  if (P.summary.headline)   push(`LinkedIn Headline: ${P.summary.headline}`);
  if (P.summary.tagline)    push(`Personal tagline used across applications: "${P.summary.tagline}"`);
  nl();

  // SKILLS
  const hasSkills = P.skills.some(s => s.category || s.items);
  if (hasSkills) {
    section('SKILLS & PROFICIENCIES');
    P.skills.forEach(s => {
      if (!s.category && !s.items) return;
      push(s.category || 'Skills');
      (s.items || '').split('\n').filter(Boolean).forEach(i => push(i));
      nl();
    });
    nl();
  }

  // WORK HISTORY
  const hasJobs = P.workHistory.some(j => j.title || j.employer);
  if (hasJobs) {
    section('WORK HISTORY');
    P.workHistory.forEach(j => {
      if (!j.title && !j.employer) return;
      push(j.title || 'Role');
      if (j.employer) push(`Employer: ${j.employer}`);
      const jPeriod = [j.startDate, j.endDate].filter(Boolean).join(' \u2013 ');
      if (jPeriod)    push(`Period: ${jPeriod}`);
      if (j.nature)   push(`Nature: ${j.nature}`);
      if (j.respUrl)       push(`Responsibilities URL: ${j.respUrl}`);
      if (j.milestonesUrl) push(`Milestones URL: ${j.milestonesUrl}`);
      nl();
      (j.bullets || '').split('\n').filter(Boolean).forEach(b => push(b));
      nl(); nl();
    });
  }

  // EDUCATION
  const hasEdu = P.education.some(e => e.degree || e.institution);
  if (hasEdu) {
    section('EDUCATION');
    P.education.forEach(e => {
      if (!e.degree && !e.institution) return;
      push(e.degree || 'Degree');
      nl();
      let instLine = e.institution || '';
      const ePeriod = [e.startYear, e.endYear].filter(Boolean).join('\u2013');
      if (ePeriod) instLine += ` (${ePeriod})`;
      if (instLine) push(instLine);
      if (e.gpa)    push(`Grade/GPA: ${e.gpa}`);
      if (e.thesis) push(`Thesis: ${e.thesis}`);
      if (e.notes)  push(e.notes);
      if (e.credentialsUrl) push(`Credentials URL: ${e.credentialsUrl}`);
      nl();
    });
    nl();
  }

  // CERTIFICATIONS & PUBLICATIONS
  const hasCerts = P.certifications.some(c => c.category || c.items) ||
                   P.publications.academic || P.publications.awards;
  if (hasCerts) {
    section('CERTIFICATIONS & PUBLICATIONS');
    P.certifications.forEach(c => {
      if (!c.category && !c.items) return;
      push(c.category || 'Certifications');
      (c.items || '').split('\n').filter(Boolean).forEach(i => push(i));
      nl();
    });
    if (P.publications.academic) {
      push('Academic Publications');
      P.publications.academic.split('\n').filter(Boolean).forEach(p2 => push(p2));
      nl();
    }
    if (P.publications.awards) {
      push('Awards');
      P.publications.awards.split('\n').filter(Boolean).forEach(a => push(a));
      nl();
    }
    nl();
  }

  // STORY BANK
  const hasStories = P.storyBank.some(s => s.title || s.text);
  if (hasStories) {
    section('STORY BANK \u2014 KEY NARRATIVES FOR COVER LETTERS');
    push('These are proven storylines extracted from your cover letters. Use them as evidence when writing tailored applications.');
    nl();
    P.storyBank.forEach((s, i) => {
      if (!s.title && !s.text) return;
      push(`STORY ${i+1}: ${s.title || 'Story'}`);
      if (s.usedFor) push(`Best used for: ${s.usedFor}`);
      if (s.text)    push(s.text);
      nl();
    });
    nl();
  }

  // PERSONAL PROJECTS
  const hasProjects = P.projects.some(p2 => p2.name || p2.description);
  if (hasProjects) {
    section('PERSONAL PROJECTS & SIDE VENTURES');
    P.projects.forEach(p2 => {
      if (!p2.name && !p2.description) return;
      push(p2.description ? `${p2.name}: ${p2.description}` : p2.name);
      if (p2.url) push(`Project URL: ${p2.url}`);
    });
    nl(); nl();
  }

  // ACHIEVEMENTS
  const hasAch = P.achievements.some(a => a.category || a.items);
  if (hasAch) {
    section('ACHIEVEMENTS & EXTRACURRICULAR');
    P.achievements.forEach(a => {
      if (!a.category && !a.items) return;
      push(a.category || 'Achievements');
      (a.items || '').split('\n').filter(Boolean).forEach(i => push(i));
      nl();
    });
    nl();
  }

  // REFEREES
  const hasRefs = P.referees.some(r => r.name);
  if (hasRefs) {
    section('REFEREES');
    P.referees.forEach(r => {
      if (!r.name) return;
      push(r.name);
      if (r.title) push(`Title: ${r.title}`);
      if (r.email) push(`Email: ${r.email}`);
      if (r.phone) push(`Phone: ${r.phone}`);
      if (r.linkedin) push(`LinkedIn: ${r.linkedin}`);
      nl();
    });
    nl();
  }

  // USAGE NOTES
  if (P.usageNotes) {
    section('USAGE NOTES \u2014 WHICH STORIES TO USE FOR WHICH ROLES');
    push(P.usageNotes);
    nl();
  }

  return lines.join('\n').replace(/\n{4,}/g, '\n\n\n').trim();
}
// ---------------------------------------------------------------------------------

function download(name, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type: type || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
}

const items = [];
const profile = get('gethired_profile_v1');
if (profile) {
  try {
    const saved = JSON.parse(profile), base = defaultP();
    P = Object.assign(base, saved, { personal: Object.assign(base.personal, saved.personal || {}),
                                      summary: Object.assign(base.summary, saved.summary || {}),
                                      publications: Object.assign(base.publications, saved.publications || {}) });
    const text = generateCVBankText();
    if (/\S/.test(text.replace(/^.*MASTER CV CONTENT BANK.*$/m, '').replace(/^\(Merged:.*$/m, '').replace(/^PERSONAL INFORMATION$/m, '')))
      items.push(['Download my CV Bank (.txt)', () => download('CV_Bank.txt', text)]);
  } catch (e) { console.warn('Saved profile could not be read', e); }
}
const bank = get('cv_content_bank');
if (bank && bank.trim() && !items.length) items.push(['Download my CV Bank (.txt)', () => download('CV_Bank.txt', bank)]);
const cl = get('cl_prompt');
if (cl && cl.trim()) items.push(['Download my edited cover letter prompt (.txt)', () => download('AI_Cover_Letter_Prompt.txt', cl)]);
const cvp = get('cv_prompt');
if (cvp && cvp.trim()) items.push(['Download my edited CV prompt (.txt)', () => download('AI_CV_Prompt.txt', cvp)]);
const sig = get('gethired_signature');
if (sig) {
  try {
    const s = JSON.parse(sig);
    if (s && s.dataUrl) items.push(['Download my signature image', () => {
      const [head, b64] = s.dataUrl.split(','), mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/png';
      const bin = atob(b64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      download('signature.' + (s.ext || 'png'), new Blob([buf], {type: mime}));
    }]);
  } catch (e) {}
}

if (!items.length) {
  location.replace(NEW_URL);
} else {
  const box = document.getElementById('dl');
  for (const [label, fn] of items) {
    const b = document.createElement('button');
    b.textContent = '\u2193 ' + label; b.onclick = fn; box.appendChild(b);
  }
  document.getElementById('saved').style.display = 'block';
}
</script>
</body>
</html>
